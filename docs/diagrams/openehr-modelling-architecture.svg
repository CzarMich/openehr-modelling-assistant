    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 19px; fill: #52657a; }
    .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.6px; fill: #52657a; }
    .heading { font-size: 23px; font-weight: 700; }
    .body { font-size: 19px; }
    .strong { font-size: 19px; font-weight: 700; }
    .small { font-size: 17px; fill: #52657a; }
    .label { font-size: 15px; font-weight: 700; fill: #52657a; }
