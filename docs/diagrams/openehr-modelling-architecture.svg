    .teal { fill: #14766f; }
    .line { fill: none; stroke: #52657a; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#arrow); }
    .optional { stroke-dasharray: 7 6; }
    .review-line { stroke: #148078; marker-end: url(#teal-arrow); }
  </style>
</defs>
<rect width="1800" height="1300" fill="white"/>
<text x="48" y="55" class="title">Figure 1. Technical architecture and human-governed modelling workflow</text>
<text x="48" y="92" class="subtitle">openEHR Modelling Assistant  ·  AI proposes, services check, people review and approve.</text>
<rect x="48" y="150" width="300" height="446" rx="14" fill="#f6f8fb" stroke="#ccd8e3" stroke-width="1.5"/>
<text x="72" y="190" class="eyebrow">INTERACTION</text>
<text x="72" y="225" class="heading">Users and MCP clients</text>
<rect x="70" y="252" width="256" height="122" rx="14" fill="white" stroke="#ccd8e3" stroke-width="1.5"/>
<text x="88" y="287" class="strong">Browser workspace</text>
<text x="88" y="316" class="small">Chat, uploads and identity</text>
<text x="88" y="341" class="small">Project and model context</text>
<rect x="70" y="406" width="256" height="144" rx="14" fill="white" stroke="#ccd8e3" stroke-width="1.5"/>
<text x="88" y="441" class="strong">External MCP clients</text>
<text x="88" y="470" class="small">Copilot Studio / other agents</text>
<text x="88" y="495" class="small">Authenticated tool calls</text>
<text x="88" y="520" class="small">Direct access to MCP services</text>
<text x="72" y="578" class="small">Access follows configured policy.</text>
<rect x="402" y="150" width="310" height="446" rx="14" fill="#eff5fc" stroke="#b9cfe5" stroke-width="1.5"/>
<text x="426" y="190" class="eyebrow">AI ASSISTANCE</text>
<text x="426" y="225" class="heading">Replaceable providers</text>
<rect x="424" y="252" width="266" height="122" rx="14" fill="white" stroke="#c9d7e5" stroke-width="1.5"/>
<text x="442" y="287" class="strong">Session-scoped model</text>
<text x="442" y="316" class="small">Claude · Codex · Copilot Studio</text>
<text x="442" y="341" class="small">Drafts and explanations</text>
<rect x="424" y="406" width="266" height="144" rx="14" fill="white" stroke="#c9d7e5" stroke-width="1.5"/>
<text x="442" y="441" class="strong">Bounded task context</text>
<text x="442" y="470" class="small">Retrieved models and guidance</text>
<text x="442" y="495" class="small">Tool results and saved handoffs</text>
<text x="442" y="520" class="small">Confirmation before writes</text>
<text x="426" y="578" class="small">AI output remains a proposal.</text>
<rect x="776" y="150" width="560" height="446" rx="14" fill="#f0f8f7" stroke="#b4d8d4" stroke-width="1.5"/>
<text x="802" y="190" class="eyebrow">AUTHENTICATED MCP CORE</text>
<text x="802" y="225" class="heading">Deterministic modelling services</text>
<text x="802" y="265" class="strong">Source discovery and reuse</text>
<text x="802" y="288" class="small">Configured CKM retrieval · source IDs and revisions</text>
<text x="802" y="318" class="strong">Model construction and inspection</text>
<text x="802" y="341" class="small">Source-aware ADL / OET drafting and model paths</text>
<text x="802" y="371" class="strong">Staged validation and project QA</text>
<text x="802" y="394" class="small">Parse / profile / native findings remain distinct</text>
<text x="802" y="424" class="strong">Model-aware AQL assistance</text>
<text x="802" y="447" class="small">Inspect exact model paths · prepare query drafts</text>
<text x="802" y="477" class="strong">Imports, traceability and comparison</text>
<text x="802" y="500" class="small">Preserve originals · requirements · revision differences</text>
<text x="802" y="530" class="strong">Controlled persistence</text>
<text x="802" y="553" class="small">Exact-revision saves · provenance · stale-write checks</text>
<rect x="1400" y="150" width="352" height="262" rx="14" fill="#f6f8fb" stroke="#ccd8e3" stroke-width="1.5"/>
<text x="1424" y="190" class="eyebrow">KNOWLEDGE SOURCES</text>
<text x="1424" y="229" class="heading">Discover and reference</text>
<text x="1424" y="273" class="body">Configured openEHR CKMs</text>
<text x="1424" y="305" class="body">Specifications and model guidance</text>
<text x="1424" y="337" class="body">Existing archetypes / templates</text>
<text x="1424" y="369" class="body">Connected repositories and uploads</text>
<rect x="1400" y="452" width="352" height="232" rx="14" fill="#f6f8fb" stroke="#ccd8e3" stroke-width="1.5"/>
<text x="1424" y="492" class="eyebrow">TERMINOLOGY · OPTIONAL</text>
<text x="1424" y="529" class="heading">Configured services</text>
<text x="1424" y="569" class="body">SNOMED CT · LOINC · ICD-10</text>
<text x="1424" y="600" class="body">UCUM · available value sets</text>
<text x="1424" y="631" class="body">Resolve and check terminology</text>
<text x="1424" y="661" class="small">Subject to access and configuration.</text>
<rect x="1400" y="732" width="352" height="228" rx="14" fill="#faf8f2" stroke="#dacfb6" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="1424" y="772" class="eyebrow">NATIVE ENGINE · OPTIONAL</text>
<text x="1424" y="809" class="heading">Validation / compilation</text>
<text x="1424" y="849" class="body">Native archetype checks</text>
<text x="1424" y="878" class="body">Template compilation · AQL parsing</text>
<text x="1424" y="916" class="small">Unavailable checks stay explicit.</text>
<rect x="48" y="680" width="664" height="280" rx="14" fill="#eef8f4" stroke="#afd2c3" stroke-width="1.5"/>
<text x="74" y="721" class="eyebrow">HUMAN GOVERNANCE</text>
<text x="74" y="758" class="heading">Review the exact model revision</text>
<text x="74" y="802" class="body">Inspect model, source references and validation evidence.</text>
<text x="74" y="834" class="body">Approve, reject or request refinement through human review.</text>
<text x="74" y="866" class="body">Clinical decisions require the configured roles and qualified checks.</text>
<text x="74" y="899" class="body">External editors can refine drafts before re-ingestion.</text>
<text x="74" y="937" class="small">Saving a draft or an AI answer does not grant clinical approval.</text>
<rect x="776" y="680" width="560" height="280" rx="14" fill="#f6f8fb" stroke="#bccbd9" stroke-width="1.5"/>
<text x="802" y="721" class="eyebrow">PERSISTENT PROJECT RECORDS</text>
<text x="802" y="758" class="heading">State survives individual AI sessions</text>
<text x="802" y="802" class="strong">Models, immutable originals and revision history</text>
<text x="802" y="828" class="small">Configured filesystem / Git / hosted repository provider</text>
<text x="802" y="868" class="strong">Requirements, provenance and governance evidence</text>
<text x="802" y="894" class="small">Authoritative project records and protected audit ledger</text>
<text x="802" y="935" class="small">Private conversation data remains separately scoped.</text>
