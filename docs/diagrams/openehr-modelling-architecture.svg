<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
<title id="title">Technical architecture and human-governed openEHR modelling workflow</title><desc id="desc">Browser and external MCP clients access authenticated modelling services. Replaceable AI providers propose drafts. Configured knowledge and terminology sources feed service tools, with optional native validation. Persistent model revisions, originals, provenance and governance are separate from AI conversations. Human reviewers make clinical decisions for an exact revision. The lifecycle runs from requirements through reuse, drafting, checks, saved revision, review, refinement and export.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#52657a"/></marker>
  <marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#148078"/></marker>
