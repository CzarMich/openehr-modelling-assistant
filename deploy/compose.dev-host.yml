# Layer on docker-compose.yml. Set an external, mode-600 MODELLING_ENV_FILE.
services:
  app:
    environment:
      MODEL_REPOSITORY_PATH: ${MODEL_REPOSITORY_PATH:-/data/models}
    env_file:
      - path: ${MODELLING_ENV_FILE:?Set MODELLING_ENV_FILE to the dev runtime configuration}
        required: true
  ingress:
    environment:
      MODELLING_APP_UPSTREAM: openehr-modelling-dev-app-1:9000
      MODELLING_CHAT_UPSTREAM: openehr-modelling-dev-chat-1:8350
    networks:
      default: {}
      proxy:
        ipv4_address: 172.18.0.242
    labels:
      - traefik.enable=true
      - traefik.docker.network=hygeoniq-proxy
      - traefik.http.routers.openehr-modelling-dev.rule=Host(`dev-openehr-modelling.sandbox.hygeoniq.com`)
      - traefik.http.routers.openehr-modelling-dev.entrypoints=websecure
      - traefik.http.routers.openehr-modelling-dev.tls=true
      - traefik.http.routers.openehr-modelling-dev.service=openehr-modelling-dev
      - traefik.http.services.openehr-modelling-dev.loadbalancer.server.port=8343
      - traefik.http.routers.openehr-modelling-dev-alias.rule=Host(`dev-openehr-modeller.sandbox.hygeoniq.com`)
      - traefik.http.routers.openehr-modelling-dev-alias.entrypoints=websecure
      - traefik.http.routers.openehr-modelling-dev-alias.tls=true
      - traefik.http.routers.openehr-modelling-dev-alias.service=openehr-modelling-dev
      - traefik.http.routers.openehr-modelling-dev-alias.middlewares=openehr-modelling-dev-canonical
      - traefik.http.middlewares.openehr-modelling-dev-canonical.redirectregex.regex=^https://dev-openehr-modeller\.sandbox\.hygeoniq\.com(?::443)?(/.*)$$
      - traefik.http.middlewares.openehr-modelling-dev-canonical.redirectregex.replacement=https://dev-openehr-modelling.sandbox.hygeoniq.com$${1}
      - traefik.http.middlewares.openehr-modelling-dev-canonical.redirectregex.permanent=false
networks:
  proxy:
    external: true
    name: hygeoniq-proxy
