server {
    listen 80;
    server_name openehr-modelling.sandbox.hygeoniq.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name openehr-modelling.sandbox.hygeoniq.com;
    ssl_certificate /etc/letsencrypt/live/sandbox.hygeoniq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sandbox.hygeoniq.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:8343;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
