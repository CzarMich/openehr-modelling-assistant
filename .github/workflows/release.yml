name: Publish verified release
on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag matching APP_VERSION and a successful delivery
        required: true
        type: string
permissions:
  contents: write
  actions: read
  packages: write
concurrency:
  group: modelling-assistant-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - name: Preserve an already published version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PYREADY'
          import json,os,re,subprocess
          tag=os.environ['TAG']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9]+(?:[.-][A-Za-z0-9]+)*)?',tag): raise SystemExit('A bare version tag is required.')
          result=subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/releases/tags/'+tag],capture_output=True,text=True)
          eligible=True
          if result.returncode==0: eligible=json.loads(result.stdout)['draft']
          elif 'HTTP 404' not in result.stderr: raise SystemExit('Cannot determine whether this release already exists.')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('eligible='+str(eligible).lower()+'\n')
          PYREADY
  release:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.repository == 'CzarMich/openehr-modelling-assistant' && needs.prepare.outputs.eligible == 'true'
    steps:
      - name: Require a bare version tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require matching APP_VERSION on main history
        id: source
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PYVERSION'
          import os,re
          from pathlib import Path
          source=Path('src/constants.php').read_text()
          match=re.search(r"define\('APP_VERSION',\s*'([^']+)'\)",source)
          if not match or match.group(1)!=os.environ['TAG']: raise SystemExit('Version tag does not match APP_VERSION.')
          PYVERSION
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Find actual successful Dev and production delivery
        id: evidence
        uses: actions/github-script@v7
        env:
          REVISION: ${{ steps.source.outputs.revision }}
        with:
          script: |
            const revision=process.env.REVISION;
            const {data}=await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'deploy-vps.yml',branch:'main',head_sha:revision,per_page:100});
            for (const run of data.workflow_runs.filter(r=>r.head_sha===revision && r.status==='completed' && r.conclusion==='success')) {
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:run.id});
              if (!jobs.some(j=>j.name==='production' && j.conclusion==='success' && j.steps.some(s=>s.name==='Promote the Dev-verified package digests' && s.conclusion==='success'))) continue;
              const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id:run.id});
              if (!artifacts.some(a=>a.name===`production-delivery-${revision}` && !a.expired)) continue;
              core.setOutput('run_id',run.id);return;
            }
            throw new Error('No actual successful delivery with retained production image evidence exists for this tag.');
      - uses: actions/download-artifact@v4
        with:
          name: production-delivery-${{ steps.source.outputs.revision }}
          run-id: ${{ steps.evidence.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/release
      - name: Validate immutable release evidence
        env:
          REVISION: ${{ steps.source.outputs.revision }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PYRELEASE'
          import json,os,runpy
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'release'
          functions=runpy.run_path('scripts/delivery-images.py')
          manifest=functions['validate'](json.loads((folder/'production-images.json').read_text()),os.environ['REVISION'])
          (folder/'images.json').write_text(json.dumps(manifest,indent=2)+'\n')
          tag=os.environ['TAG']; changelog=Path('CHANGELOG.md').read_text()
          section='## ['+tag+']'
          if section not in changelog: raise SystemExit('Add the versioned release notes to CHANGELOG.md before tagging.')
          notes=changelog.split(section,1)[1].split('\n',1)[1].split('\n## [',1)[0].strip()+'\n'
          (folder/'notes.md').write_text('Source revision: `'+os.environ['REVISION']+'`\n\nPublished from the same immutable images verified on Dev and production.\n\n'+notes)
          (folder/'references.tsv').write_text(''.join(component+'\t'+image+'\n' for component,image in manifest['images'].items()))
          PYRELEASE
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Add version tags to the verified packages
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          while IFS=$'\t' read -r component image; do
            docker buildx imagetools create --tag "${image%@*}:$TAG" "$image"
            if [[ "$component" == app ]]; then
              docker buildx imagetools create --tag "ghcr.io/czarmich/openehr-modelling-assistant:$TAG" "$image"
            fi
          done < "$RUNNER_TEMP/release/references.tsv"
      - name: Create source and deployment packages
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix=openehr-modelling-assistant/ --output="$RUNNER_TEMP/release/source-$TAG.tar.gz" HEAD
          tar -czf "$RUNNER_TEMP/release/deployment-$TAG.tar.gz" deploy scripts/deploy-images.sh scripts/delivery-images.py LICENSE THIRD_PARTY_NOTICES.md -C "$RUNNER_TEMP/release" images.json
          cd "$RUNNER_TEMP/release"
          sha256sum images.json "source-$TAG.tar.gz" "deployment-$TAG.tar.gz" > SHA256SUMS
      - name: Publish the GitHub release and packaged evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --notes-file "$RUNNER_TEMP/release/notes.md"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP/release/images.json" "$RUNNER_TEMP/release/source-$TAG.tar.gz" "$RUNNER_TEMP/release/deployment-$TAG.tar.gz" "$RUNNER_TEMP/release/SHA256SUMS" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
