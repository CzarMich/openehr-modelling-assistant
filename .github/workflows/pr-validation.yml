name: PR validation

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, json, simplexml
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate SDD traceability (spec-check)
        run: composer check:spec

      - name: Run PHPStan
        run: composer check:phpstan

      - name: Run PHPUnit
        run: composer test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image (production target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Exercise real container protocol and persistence
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose up -d --build --wait
          python3 scripts/mcp-smoke.py --evidence docs/evidence/ci-http-smoke.json

      - name: Dependency audit
        run: composer audit

      - name: Preserve protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelling-assistant-protocol-evidence
          path: docs/evidence/ci-http-smoke.json
          if-no-files-found: warn
