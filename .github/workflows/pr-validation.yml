name: PR validation

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, json, mbstring, simplexml
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate SDD traceability (spec-check)
        run: composer check:spec

      - name: Run PHPStan
        run: composer check:phpstan

      - name: Run PHPUnit
        run: composer test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image (production target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Exercise real container protocol and persistence
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose up -d --build --wait
          python3 scripts/mcp-smoke.py --evidence docs/evidence/ci-http-smoke.json

      - name: Exercise Git persistence without terminology
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/MODEL_REPOSITORY_PROVIDER=filesystem/MODEL_REPOSITORY_PROVIDER=git/; s/MODEL_REPOSITORY_WRITE_ENABLED=false/MODEL_REPOSITORY_WRITE_ENABLED=true/' .env
          docker compose up -d --force-recreate --wait
          python3 scripts/mcp-smoke.py --writes --without-terminology --evidence docs/evidence/ci-git-smoke.json

      - name: Dependency audit
        run: composer audit

      - name: Exercise isolated OIDC authentication and authorization over HTTP
        run: scripts/test-oidc-container.sh

      - name: Exercise SharePoint contracts with isolated HTTPS Graph and OAuth fixtures
        run: scripts/test-sharepoint-container.sh

      - name: Exercise FHIR operations over isolated authenticated HTTPS
        run: scripts/test-terminology-container.sh

      - name: Preserve protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelling-assistant-protocol-evidence
          path: docs/evidence/ci-*-smoke.json
          if-no-files-found: warn

  browser-chat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: chat/package-lock.json
      - run: npm ci --prefix chat --ignore-scripts
      - run: npm --prefix chat run check:format
      - run: npm --prefix chat test
      - run: npx playwright install --with-deps chromium
        working-directory: chat
      - run: npm --prefix chat run test:browser
      - run: npm audit --prefix chat
      - name: Preserve browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelling-browser-evidence
          path: chat/test-results/
          if-no-files-found: ignore
