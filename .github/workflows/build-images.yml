name: Build validated delivery images
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: app
            file: Dockerfile
            target: production
          - component: chat
            file: chat/Dockerfile
            target: chat
          - component: reviews
            file: chat/Dockerfile
            target: reviews
          - component: ingress
            file: Dockerfile
            target: ingress
          - component: engine
            file: engine/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the validated component
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/czarmich/openehr-modelling-assistant-${{ matrix.component }}:sha-${{ inputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/CzarMich/openehr-modelling-assistant
            org.opencontainers.image.revision=${{ inputs.revision }}
            org.opencontainers.image.authors=Michael Anywar
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=delivery-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=delivery-${{ matrix.component }}
      - name: Record immutable image evidence
        env:
          REVISION: ${{ inputs.revision }}
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json,os
          component=os.environ['COMPONENT']
          json.dump({'revision':os.environ['REVISION'],'component':component,'image':'ghcr.io/czarmich/openehr-modelling-assistant-'+component,'digest':os.environ['DIGEST']},open(component+'.json','w'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-image-${{ matrix.component }}-${{ inputs.revision }}
          path: ${{ matrix.component }}.json
          retention-days: 90
